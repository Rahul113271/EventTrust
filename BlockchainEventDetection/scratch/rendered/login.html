
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="User Login for Blockchain-Based Event Detection System">
    <meta name="keywords" content="login, blockchain, event detection, trust verification">
    <title>Login — TrustChain</title>
    <link rel="stylesheet" type="text/css" href="/static/app.css">

    <!-- Form Validation Script -->
    <script language="javascript">
    function validate(formObj) {
        // Username validation
        if(formObj.t1.value.length==0) {
            alert("Please Enter User ID");
            formObj.t1.focus();
            return false;
        }
        
        // Password validation
        if(formObj.t2.value.length==0) {
            alert("Please Enter Password");
            formObj.t2.focus();
            return false;
        }
        
        return true;
    }
    </script>
</head>
<body>
    <div class="app-shell">
        <!-- Top Navigation -->
        <nav class="topbar">
            <div class="topbar-brand">
                <div class="topbar-logo">⛓</div>
                <div>
                    <div class="topbar-title">TrustChain</div>
                    <div class="topbar-subtitle">Blockchain Event Intelligence</div>
                </div>
            </div>
            <div class="topbar-nav">
                <a href="/index.html">🏠 Home</a>
                <a href="/UserLogin.html" class="active">🔐 Login</a>
                <a href="/Register.html">📝 Sign Up</a>
            </div>
        </nav>

        <!-- Login Form -->
        <div class="auth-wrapper">
            <div class="auth-card animate-in">
                <div style="text-align:center; margin-bottom: 20px;">
                    <div style="width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--accent-cyan),var(--accent-blue));display:inline-flex;align-items:center;justify-content:center;font-size:26px;color:var(--bg-primary);">🔐</div>
                </div>
                <h2>Welcome Back</h2>
                <p class="auth-sub">Sign in to access the event detection dashboard</p>

                <!-- Display error/success messages -->
                

                <form name="f1" method="post" action="/UserLoginAction" onsubmit="return validate(this);">
                    <input type="hidden" name="csrfmiddlewaretoken" value="vWn6EB53zYwBNfKNEdZDGrWLXv85uOPFBsadS4SXBLqxKKe5kC2fUEbbtKmT3yS5">
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" name="t1" class="form-input" placeholder="Enter your username">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" name="t2" class="form-input" placeholder="Enter your password">
                    </div>
                    <button type="submit" class="btn btn-primary form-submit-btn" style="width:100%;">Sign In →</button>
                </form>
                <div class="auth-footer">
                    Don't have an account? <a href="/Register.html">Create one</a>
                </div>
            </div>
        </div>

        <footer class="app-footer">
            Blockchain-Based Event Detection & Trust Verification
        </footer>
    </div>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="User Registration for Blockchain-Based Event Detection and Trust Verification">
    <meta name="keywords" content="registration, signup, blockchain, event detection">
    <title>Sign Up — TrustChain</title>
    <link rel="stylesheet" type="text/css" href="/static/app.css">

    <!-- Form Validation Script -->
    <script language="javascript">
    function validate(formObj) {
        // Username validation
        if(formObj.t1.value.length==0) {
            alert("Please Enter User ID");
            formObj.t1.focus();
            return false;
        }
        
        // Password validation
        if(formObj.t2.value.length==0) {
            alert("Please Enter Password");
            formObj.t2.focus();
            return false;
        }
        
        // Contact number validation
        if(formObj.t3.value.length==0) {
            alert("Please Enter Contact No");
            formObj.t3.focus();
            return false;
        }
        if(isNaN(formObj.t3.value)) {
            window.alert("Please enter valid mobile no");
            formObj.t3.focus();
            return false;
        }
        
        // Email validation
        if(formObj.t4.value.length==0) {
            alert("Please Enter Email ID");
            formObj.t4.focus();
            return false;
        }
        var filter = /^([a-zA-Z0-9_\.\-])+\@(gmail+\.)+(com)+$/;
        if (!filter.test(formObj.t4.value)) {
            window.alert('enter a valid email address');
            formObj.t4.focus();
            return false;
        }
        
        // Address validation
        if(formObj.t5.value.length==0) {
            alert("Please Enter Address");
            formObj.t5.focus();
            return false;
        }
        
        return true;
    }
    </script>
</head>
<body>

        <!-- Registration Form -->

                </div>
                <h2>Create Account</h2>
                <p class="auth-sub">Register to access the blockchain event detection platform</p>

                <!-- Display error/success messages -->
                

                <form name="f1" method="post" action="/RegisterAction" onsubmit="return validate(this);">
                    <input type="hidden" name="csrfmiddlewaretoken" value="sIfCQUMliBPEcY6dhfa35kbhcIItk9HMIFvE7ek2Clv5R9PmkbloQSsgSA5JuIgu">
                    <div class="form-group">
                        <label class="form-label">Username</label>

                    <div class="form-group">

                    <div class="form-group">

                    <div class="form-group">
